
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takeover By Degitalmedia Inc</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050510;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    padding: 30px;
    animation: appear 2s ease;
}

h1 {
    font-size: clamp(30px, 7vw, 75px);
    font-weight: 900;
    letter-spacing: 5px;
    background: linear-gradient(
        90deg,
        #00ffff,
        #ffffff,
        #ff00ff,
        #00ffff
    );
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient 4s linear infinite,
               glow 2s ease-in-out infinite alternate;
}

h2 {
    margin-top: 20px;
    font-size: clamp(17px, 4vw, 35px);
    letter-spacing: 4px;
    color: white;
    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff,
        0 0 50px #ff00ff;
    animation: pulse 2s infinite;
}

.line {
    width: 0;
    height: 3px;
    margin: 25px auto;
    background: linear-gradient(90deg, cyan, magenta);
    box-shadow: 0 0 15px cyan;
    animation: expand 2s forwards;
}

p {
    color: #a9caff;
    letter-spacing: 5px;
    font-size: 12px;
}

@keyframes gradient {
    0% { background-position: 0%; }
    100% { background-position: 300%; }
}

@keyframes glow {
    from { filter: drop-shadow(0 0 5px cyan); }
    to { filter: drop-shadow(0 0 25px magenta); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
}

@keyframes expand {
    to { width: 100%; }
}

@keyframes appear {
    from { opacity: 0; transform: scale(.5); }
    to { opacity: 1; transform: scale(1); }
}

/* Floating stars */
.star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px cyan;
    animation: float 5s infinite ease-in-out;
}

@keyframes float {
    0%, 100% { transform: translateY(0); opacity: .2; }
    50% { transform: translateY(-50px); opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
    <h1>TAKEOVER</h1>
    <div class="line"></div>
    <h2>BY DIGITALMEDIAINC</h2>
    <br>
    <p> DIGITAL EXCELLENCE </p>
</div>

<script>
for (let i = 0; i < 60; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(star);
}
</script>

</body>
</html>
